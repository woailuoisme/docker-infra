apiVersion: 1

# ==============================================================================
# Grafana 13.x 统一数据源自动配置 (Datasources as Code)
# 针对 InfluxDB 3.x 列式时序引擎与 Telegraf 采集器
# ==============================================================================

datasources:
  # ----------------------------------------------------------------------------
  # 1. InfluxDB 3.x 原生 SQL (基于 Apache Arrow Flight SQL 高性能列式查询协议)
  # ----------------------------------------------------------------------------
  - name: InfluxDB3-SQL
    uid: InfluxDB3-SQL
    type: influxdb
    access: proxy
    url: http://influxdb:8181
    isDefault: true
    jsonData:
      version: SQL
      dbName: ${INFLUXDB_DATABASE}
      defaultBucket: ${INFLUXDB_DATABASE}
      httpMode: POST
      insecureGrpc: true
    secureJsonData:
      token: ${INFLUXDB_TOKEN}
    editable: true

  # ----------------------------------------------------------------------------
  # 2. InfluxDB 3.x InfluxQL 兼容模式数据源 (支持传统 InfluxQL 语法与告警规则)
  # ----------------------------------------------------------------------------
  - name: InfluxDB3-InfluxQL
    uid: InfluxDB3-InfluxQL
    type: influxdb
    access: proxy
    url: http://influxdb:8181
    database: ${INFLUXDB_DATABASE}
    jsonData:
      version: InfluxQL
      httpMode: GET
      httpHeaderName1: Authorization
    secureJsonData:
      httpHeaderValue1: Token ${INFLUXDB_TOKEN}
      token: ${INFLUXDB_TOKEN}
    editable: true

  # ----------------------------------------------------------------------------
  # 3. Valkey 8.0 / Redis 内存键值存储监控数据源 (基于 redis-datasource 插件)
  # ----------------------------------------------------------------------------
  - name: Valkey-Redis
    uid: Valkey-Redis
    type: redis-datasource
    access: proxy
    url: redis://valkey:6379
    secureJsonData:
      password: ${REDIS_PASSWORD}
    editable: true

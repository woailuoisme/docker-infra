apiVersion: 1

# ==============================================================================
# Grafana 13.x 统一仪表盘自动挂载配置 (Dashboards as Code)
# 自动扫描并加载 /var/lib/grafana/dashboards 目录下的专业看板
# ==============================================================================

providers:
  - name: 'IoT & Observability Dashboards'
    orgId: 1
    folder: 'IoT & Observability'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 15
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

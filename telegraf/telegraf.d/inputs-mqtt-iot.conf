# ==============================================================================
# Telegraf MQTT 消费者输入配置 (IoT Telemetry / Events / Status / ACKs)
# 针对冷链售货机集群 MQTT 5.0 规范，解析 JSON v2 数据并注入 Topic 动态标签
# ==============================================================================

# ==================== 1. 售货机周期遥测解析 (Telemetry) ====================
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics = ["v1/vm/+/telemetry"]
  data_format = "json_v2"
  client_id = "telegraf_iot_telemetry"
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"
  qos = 0

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "vm_telemetry"
    timestamp_path = "ts"
    timestamp_format = "2006-01-02T15:04:05.999Z07:00"

    [[inputs.mqtt_consumer.topic_parsing]]
      topic = "v1/vm/+/telemetry"
      tags = "_/_/device_no/_"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "system.voltage"
      rename = "voltage"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "system.current"
      rename = "current"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "system.uptime"
      rename = "uptime"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "system.door_closed"
      rename = "door_closed"
      type = "bool"
    
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "environment.freezer_temps.0"
      rename = "temp_zone_0"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "environment.freezer_temps.1"
      rename = "temp_zone_1"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "environment.freezer_temps.2"
      rename = "temp_zone_2"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "environment.freezer_temps.3"
      rename = "temp_zone_3"
      type = "float"
    
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "environment.ambient_temp"
      rename = "ambient_temp"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "environment.vibration_g"
      rename = "vibration_g"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "connectivity.rssi"
      rename = "rssi"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "location.lat"
      rename = "lat"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "location.lng"
      rename = "lng"
      type = "float"

# ==================== 2. 关键业务与告警事件解析 (Events) ====================
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics = ["v1/vm/+/events"]
  data_format = "json_v2"
  client_id = "telegraf_iot_events"
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"
  qos = 1

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "vm_events"
    timestamp_path = "ts"
    timestamp_format = "unix"

    [[inputs.mqtt_consumer.topic_parsing]]
      topic = "v1/vm/+/events"
      tags = "_/_/device_no/_"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "event_type"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "data.order_id"
      rename = "order_id"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "data.channel_id"
      rename = "channel_id"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "data.error_code"
      rename = "error_code"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "data.g_force"
      rename = "g_force"
      type = "float"
      optional = true

# ==================== 3. 设备上下线状态解析 (Status) ====================
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics = ["v1/vm/+/status"]
  data_format = "json_v2"
  client_id = "telegraf_iot_status"
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"
  qos = 1

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "vm_status"
    timestamp_path = "ts"
    timestamp_format = "unix"

    [[inputs.mqtt_consumer.topic_parsing]]
      topic = "v1/vm/+/status"
      tags = "_/_/device_no/_"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "status"
    
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "firmware"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "hardware"
      optional = true

# ==================== 4. 远程控制指令响应解析 (Commands ACK) ====================
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics = ["v1/vm/+/commands/ack"]
  data_format = "json_v2"
  client_id = "telegraf_iot_acks"
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"
  qos = 1

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "vm_command_acks"

    [[inputs.mqtt_consumer.topic_parsing]]
      topic = "v1/vm/+/commands/ack"
      tags = "_/_/device_no/_/_"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "status"
    
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "cmd_id"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "result.duration_ms"
      rename = "execution_duration_ms"
      type = "int"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "error.code"
      rename = "error_code"
      optional = true

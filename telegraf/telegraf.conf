# ==============================================================================
# Telegraf 主配置文件 (Telegraf 1.40 Core Agent Configuration)
# 针对 IoT 高并发遥测场景深度调优与容器化最佳实践
# ==============================================================================

[agent]
  ## 指标收集与刷新周期 (默认 10s)
  interval = "10s"
  round_interval = true

  ## 批量写入与内存缓冲优化（适配 IoT 高并发消息摄入，官方默认分别为 1000 与 10000）
  metric_batch_size = 5000
  metric_buffer_limit = 50000

  ## 写入抖动优化：增加 2s 随机扰动，平滑 I/O 避免整点突发网络与数据库毛刺
  flush_interval = "10s"
  flush_jitter = "2s"

  ## 容器化与 IoT 最佳实践：禁止自动向指标注入容器名 host 标签，防止容器重建引发时序基数膨胀 (Series Cardinality Explosion)
  omit_hostname = true

  ## 容器化日志推荐：结构化 key=value 日志输出格式
  logformat = "structured"

  ## 流水线处理优化：聚合后跳过第二轮处理器管道（Telegraf 1.40+ 官方规范），消除重复计算与启动告警
  skip_processors_after_aggregators = true

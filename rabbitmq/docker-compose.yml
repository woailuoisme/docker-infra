services:
  rabbitmq:
    image: rabbitmq:4.4-management-alpine
    container_name: rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    ports:
      # AMQP 0-9-1 / 1.0 核心客户端通信端口
      - "5672:5672"
      # Web 管理后台与 HTTP API 端口
      - "15672:15672"
    environment:
      - TZ=${TIMEZONE}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-admin}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-admin123!}
    volumes:
      - ${DATA_PATH}rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - backend
      - frontend

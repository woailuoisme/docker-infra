services:
  restate:
    image: restatedev/restate:1.8
    container_name: restate
    restart: unless-stopped
    ports:
      - "8280:8080"
      - "9070:9070"
    environment:
      - TZ=${TIMEZONE:-Asia/Shanghai}
      - RESTATE_NODE_NAME=restate
      - RESTATE_LOG_FILTER=warn,restate=info
    volumes:
      - ${DATA_PATH}restate:/restate-data
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9070/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - frontend
      - backend


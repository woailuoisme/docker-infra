# yaml-language-server: $schema=https://json.schemastore.org/traefik-v3.json
# ==============================================================================
# Traefik v3 Static Configuration (静态基础配置)
# ==============================================================================

global:
  checkNewVersion: false
  sendAnonymousUsage: false

# ------------------------------------------------------------------------------
# 日志配置 (Logging)
# ------------------------------------------------------------------------------
log:
  level: INFO
  format: common

accessLog:
  filePath: "/var/log/traefik/access.log"
  format: json
  bufferingSize: 100
  filters:
    retryAttempts: true
    minDuration: 10ms

# ------------------------------------------------------------------------------
# 实验性功能与社区插件 (Plugins)
# ------------------------------------------------------------------------------
experimental:
  plugins:
    crowdsec-bouncer:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.8.1
    sablier:
      moduleName: github.com/sablierapp/sablier-traefik-plugin
      version: v1.4.0
    # souin:
    #   moduleName: github.com/darkweak/souin
    #   version: v1.7.8

# ------------------------------------------------------------------------------
# API 与 Dashboard 仪表盘 (API & Dashboard)
# ------------------------------------------------------------------------------
api:
  dashboard: true
  insecure: false # 禁用非安全的 8080 直接端口暴露，改由 dynamic/dashboard.yml 统一路由管理

# ------------------------------------------------------------------------------
# 内部健康检查探针 (Ping Health Check)
# ------------------------------------------------------------------------------
ping: {}

# ------------------------------------------------------------------------------
# 入口点配置 (EntryPoints)
# ------------------------------------------------------------------------------
entryPoints:
  # HTTP 入口 (默认自动重定向至 HTTPS)
  web:
    address: ":80"
    http:
      aliasHeadersStrategy: delete
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  # HTTPS 入口 (支持 HTTP/3，全局挂载 CrowdSec WAF/入侵防御 与 Error-Pages 统一美化错误页中间件)
  websecure:
    address: ":443"
    http3: {}
    http:
      tls: {}
      # 剔除名称包含非字母/数字/短横线的别名请求头，防止伪造 Authelia 等信任头
      aliasHeadersStrategy: delete
      # 严格过滤请求路径中的保留编码字符，防止 Split-View 路径解析差异与目录穿越攻击 (RFC 3986)
      # 注意: 仅作用于 URL Path，不影响 Query 参数；若特定业务(如 S3 对象名/Temporal ID)确需在 Path 中传 %2F，可将该项改回 true
      encodedCharacters:
        allowEncodedSlash: false          # 拒绝 %2f / %2F (/)
        allowEncodedBackSlash: false      # 拒绝 %5c / %5C (\)
        allowEncodedNullCharacter: false  # 拒绝 %00 (NULL)
        allowEncodedSemicolon: false      # 拒绝 %3b / %3B (;)
        allowEncodedPercent: false        # 拒绝 %25 (%)
        allowEncodedQuestionMark: false   # 拒绝 %3f / %3F (?)
        allowEncodedHash: false           # 拒绝 %23 (#)
      middlewares:
        - crowdsec-bouncer@file
        - error-pages@file

  # Prometheus 监控指标专用内部入口点 (由 vmagent 内部抓取，不暴露公网)
  metrics:
    address: ":8082"
    http:
      aliasHeadersStrategy: delete

  # MQTTS 物联网设备安全入口 (TCP 8883，专供 MQTT over TLS 设备连接)
  mqtts:
    address: ":8883"
    http:
      aliasHeadersStrategy: delete

  # 内部探针入口点 (由 ping 自动使用，未配置 address 时默认 :8080，显式声明以消除未配置告警)
  traefik:
    http:
      aliasHeadersStrategy: delete

# ------------------------------------------------------------------------------
# 配置提供者 (Providers)
# ------------------------------------------------------------------------------
providers:
  # File 动态文件配置提供者 (支持 Go 模版变量热重载)
  file:
    directory: "/etc/traefik/dynamic"
    watch: true

# ------------------------------------------------------------------------------
# 证书解析器 (Let's Encrypt ACME 原生自动签发与续期)
# ------------------------------------------------------------------------------
certificatesResolvers:
  letsencrypt:
    acme:
      email: admin@example.com
      storage: /etc/traefik/acme/acme.json
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"

# ------------------------------------------------------------------------------
# 监控与指标采集 (Prometheus Metrics)
# ------------------------------------------------------------------------------
metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true

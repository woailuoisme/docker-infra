# yaml-language-server: $schema=https://json.schemastore.org/traefik-v3.json
# ==============================================================================
# InfluxDB 3 Explorer Web 控制台路由配置 (InfluxDB UI Router & Service)
# 访问地址: influx.{{ env "SITE_ADDRESS" }} 或 influxdb.{{ env "SITE_ADDRESS" }}
# 受 Authelia SSO 统一保护 (chain-auth@file)
# ==============================================================================

http:
  routers:
    influxdb-ui:
      rule: 'Host(`influx.{{ env "SITE_ADDRESS" }}`) || Host(`influxdb.{{ env "SITE_ADDRESS" }}`)'
      entryPoints:
        - websecure
      service: influxdb-ui-service
      tls: {}
      middlewares:
        - chain-auth@file

  services:
    influxdb-ui-service:
      loadBalancer:
        servers:
          - url: "http://influxdb-ui:8080"
        passHostHeader: true

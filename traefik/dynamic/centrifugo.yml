# yaml-language-server: $schema=https://json.schemastore.org/traefik-v3.json
# ==============================================================================
# Centrifugo 实时消息推送引擎路由配置 (Centrifugo WebSocket / SSE / HTTP API)
# 支持客户端长链接、WebSocket 握手升级，透传 Host 头
# ==============================================================================

http:
  routers:
    centrifugo:
      rule: 'Host(`ws.{{ env "SITE_ADDRESS" }}`)'
      entryPoints:
        - websecure
      service: centrifugo-service
      tls: {}
      middlewares:
        - chain-basic@file

  services:
    centrifugo-service:
      loadBalancer:
        servers:
          - url: "http://centrifugo:8000"
        passHostHeader: true

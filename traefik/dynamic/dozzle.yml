# yaml-language-server: $schema=https://json.schemastore.org/traefik-v3.json
# ==============================================================================
# Dozzle 容器流式日志查看器路由配置 (Dozzle Router & Service)
# 受 Authelia SSO 统一保护 (chain-auth@file)
# ==============================================================================

http:
  routers:
    dozzle:
      rule: 'Host(`dozzle.{{ env "SITE_ADDRESS" }}`)'
      entryPoints:
        - websecure
      service: dozzle-service
      tls: {}
      middlewares:
        - chain-auth@file

  services:
    dozzle-service:
      loadBalancer:
        servers:
          - url: "http://dozzle:8080"
        passHostHeader: true

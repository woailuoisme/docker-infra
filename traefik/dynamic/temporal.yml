# yaml-language-server: $schema=https://json.schemastore.org/traefik-v3.json
# ==============================================================================
# Temporal Web UI 分布式工作流看板路由配置 (Temporal Router & Service)
# 行业标准前缀: workflow.{{ env "SITE_ADDRESS" }} (同时兼容保留旧前缀 temporal.{{ env "SITE_ADDRESS" }})
# 受 Authelia SSO 统一保护 (chain-auth@file)
# ==============================================================================

http:
  routers:
    temporal:
      rule: 'Host(`workflow.{{ env "SITE_ADDRESS" }}`) || Host(`temporal.{{ env "SITE_ADDRESS" }}`)'
      entryPoints:
        - websecure
      service: temporal-service
      tls: {}
      middlewares:
        - chain-auth@file

  services:
    temporal-service:
      loadBalancer:
        servers:
          - url: "http://temporal:8233"
        passHostHeader: true

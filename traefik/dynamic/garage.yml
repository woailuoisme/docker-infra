# yaml-language-server: $schema=https://json.schemastore.org/traefik-v3.json
# ==============================================================================
# Garage 分布式 S3 对象存储路由配置 (Garage S3 API & WebUI)
#   - s3.{{ env "SITE_ADDRESS" }}         : S3 API 标准 REST 接口 (chain-basic@file)
#   - storage-ui.{{ env "SITE_ADDRESS" }} : WebUI 存储管理控制台 (兼容 s3-ui.，受 Authelia 保护)
# ==============================================================================

http:
  routers:
    # --- Garage S3 API (供 S3 客户端 / SDK 访问，支持 Path-style 与 Virtual-host-style 子域名) ---
    garage-s3:
      rule: 'Host(`s3.{{ env "SITE_ADDRESS" }}`) || HostRegexp(`^[a-z0-9.-]+\.s3\.{{ env "SITE_ADDRESS" }}$`)'
      entryPoints:
        - websecure
      service: garage-s3-service
      tls: {}
      middlewares:
        - chain-basic@file

    # --- Garage WebUI 控制台 (受 Authelia SSO 统一保护) ---
    garage-webui:
      rule: 'Host(`storage-ui.{{ env "SITE_ADDRESS" }}`) || Host(`s3-ui.{{ env "SITE_ADDRESS" }}`)'
      entryPoints:
        - websecure
      service: garage-webui-service
      tls: {}
      middlewares:
        - chain-auth@file

  services:
    # Garage S3 REST API (容器端口: 3900)
    garage-s3-service:
      loadBalancer:
        servers:
          - url: "http://garage:3900"
        passHostHeader: true

    # Garage WebUI 管理面板 (容器端口: 3909)
    garage-webui-service:
      loadBalancer:
        servers:
          - url: "http://garage-webui:3909"
        passHostHeader: true

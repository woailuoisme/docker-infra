# yaml-language-server: $schema=https://json.schemastore.org/traefik-v3.json
# ==============================================================================
# Traefik v3 Dashboard 仪表盘路由配置 (Dashboard Router)
# 受 Authelia SSO 统一保护 (chain-auth@file)，根路径自动跳转 /dashboard/
# ==============================================================================

http:
  routers:
    # 根路径重定向至 /dashboard/
    traefik-dashboard-root:
      rule: 'Host(`traefik.{{ env "SITE_ADDRESS" }}`) && Path(`/`)'
      priority: 100
      entryPoints:
        - websecure
      service: api@internal
      tls: {}
      middlewares:
        - chain-auth@file
        - traefik-redirect-dashboard

    # 主仪表盘路由 (包含 /dashboard/ 与 /api/*)
    traefik-dashboard:
      rule: 'Host(`traefik.{{ env "SITE_ADDRESS" }}`)'
      priority: 10
      entryPoints:
        - websecure
      service: api@internal
      tls: {}
      middlewares:
        - chain-auth@file

  middlewares:
    traefik-redirect-dashboard:
      redirectRegex:
        regex: "^https?://([^/]+)/?$"
        replacement: "https://${1}/dashboard/"
        permanent: false


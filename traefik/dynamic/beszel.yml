# yaml-language-server: $schema=https://json.schemastore.org/traefik-v3.json
# ==============================================================================
# Beszel 服务器与容器监控看板路由配置 (Beszel Router & Service)
# 行业标准前缀: beszel.{{ env "SITE_ADDRESS" }} (同时兼容保留 monitor.{{ env "SITE_ADDRESS" }})
# 挂载基础安全与压缩链路 (chain-basic@file)，访问由 Beszel 内置 PocketBase 用户系统独立鉴权
# ==============================================================================

http:
  routers:
    beszel:
      rule: 'Host(`beszel.{{ env "SITE_ADDRESS" }}`) || Host(`monitor.{{ env "SITE_ADDRESS" }}`)'
      entryPoints:
        - websecure
      service: beszel-service
      tls: {}
      middlewares:
        - chain-basic@file

  services:
    beszel-service:
      loadBalancer:
        servers:
          - url: "http://beszel:8090"
        passHostHeader: true

# yaml-language-server: $schema=https://json.schemastore.org/traefik-v3.json
# ==============================================================================
# Portainer 容器管理控制台路由配置 (Portainer Router & Service)
# 行业标准极简前缀: docker.{{ env "SITE_ADDRESS" }} (同时兼容保留 portainer.)
# 挂载基础安全链路 (chain-basic@file)，由 Portainer 内置用户鉴权独立保护
# ==============================================================================

http:
  routers:
    portainer:
      rule: 'Host(`docker.{{ env "SITE_ADDRESS" }}`) || Host(`portainer.{{ env "SITE_ADDRESS" }}`)'
      entryPoints:
        - websecure
      service: portainer-service
      tls: {}
      middlewares:
        - chain-basic@file

  services:
    portainer-service:
      loadBalancer:
        servers:
          - url: "http://portainer:9000"
        passHostHeader: true

services:
  traefik:
    container_name: traefik
    image: traefik:v3.7
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS}
      - TZ=${TIMEZONE}
      - AUTHELIA_HOST=${AUTHELIA_HOST}
      - CROWDSEC_BOUNCER_KEY=${CROWDSEC_BOUNCER_KEY}
      - CROWDSEC_LAPI_HOST=${CROWDSEC_LAPI_HOST}
      - CROWDSEC_APPSEC_HOST=${CROWDSEC_APPSEC_HOST}
      - CF_DNS_API_TOKEN=${CF_API_TOKEN}
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL=${LEGO_EMAIL}
    volumes:
      # 移除 /var/run/docker.sock 消除提权逃逸面，遵循最小特权原则
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - ${DATA_PATH}ssl:/etc/traefik/certs:ro
      - ${DATA_PATH}traefik/acme:/etc/traefik/acme
      - ${DATA_PATH}traefik/plugins-storage:/plugins-storage
      - ${LOG_PATH}traefik:/var/log/traefik
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      crowdsec:
        condition: service_healthy
    networks:
      - frontend
      - backend

services:
  traefik:
    container_name: traefik
    image: traefik:${TRAEFIK_VERSION:-v3.7}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS}
      - TZ=${TIMEZONE:-Asia/Shanghai}
      - AUTHELIA_HOST=${AUTHELIA_HOST:-authelia:9091}
      - CROWDSEC_BOUNCER_KEY=${CROWDSEC_BOUNCER_KEY}
      - CROWDSEC_LAPI_HOST=${CROWDSEC_LAPI_HOST:-crowdsec:8080}
      - CROWDSEC_APPSEC_HOST=${CROWDSEC_APPSEC_HOST:-crowdsec:7422}
      - CF_DNS_API_TOKEN=${CF_API_TOKEN}
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL=${LEGO_EMAIL:-admin@${SITE_ADDRESS:-example.com}}
    volumes:
      # 移除 /var/run/docker.sock 消除提权逃逸面，遵循最小特权原则
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - ${DATA_PATH:-./data/}ssl:/etc/traefik/certs:ro
      - ${DATA_PATH:-./data/}traefik/acme:/etc/traefik/acme
      - ${DATA_PATH:-./data/}traefik/plugins-storage:/plugins-storage
      - ${LOG_PATH:-./logs/}traefik:/var/log/traefik
    ports:
      - "${TRAEFIK_PORT:-80}:80"
      - "${TRAEFIK_SSL_PORT:-443}:443"
      - "${TRAEFIK_SSL_PORT:-443}:443/udp"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M
    depends_on:
      crowdsec:
        condition: service_healthy
    networks:
      - frontend
      - backend

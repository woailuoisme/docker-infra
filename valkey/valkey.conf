# Valkey 9.1 生产配置 (2核1G 低配队列/缓存调优)
# 核心原则：noeviction 保护关键队列数据，AOF 保底，异步释放避免主线程卡顿

# 网络绑定 (容器内监听所有网卡)
bind 0.0.0.0

# 内存限制与淘汰策略
# 内存封顶 256MB，与容器层 384MB 限额形成双重防护
maxmemory 256mb
# 队列主导场景严禁淘汰未消费任务（内存写满时拒绝写入并报错）
maxmemory-policy noeviction

# 异步延迟释放 (Lazy Free) - 大对象与过期 Key 异步后台清理，杜绝主线程延迟毛刺
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes
lazyfree-lazy-user-flush yes

# 持久化：开启 AOF 增量安全写入 (默认混合持久化与每秒 fsync 保持开启)
appendonly yes

# 资源与并发收敛
maxclients 1000
databases 2

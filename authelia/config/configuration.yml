# Authelia 4.39 生产与开发最佳实践配置
# 官方文档: https://www.authelia.com/configuration/prologue/introduction/

theme: dark

# 身份验证重置密码 JWT 密钥 (通过环境变量注入)
identity_validation:
  reset_password:
    jwt_secret: '{{ env "JWT_SECRET" }}'

# 服务监听与网关集成端点
server:
  address: "tcp://0.0.0.0:9091"
  buffers:
    read: 8192
    write: 8192
  endpoints:
    authz:
      auth-request:
        implementation: "AuthRequest"
      forward-auth:
        implementation: "ForwardAuth"
      ext-authz:
        implementation: "ExtAuthz"
      legacy:
        implementation: "Legacy"

# 结构化日志
log:
  level: info
  format: json

# 双因子认证: TOTP 与 WebAuthn / Passkeys
totp:
  issuer: '{{ env "DOMAIN" }}'
  algorithm: sha1
  period: 30
  digits: 6

webauthn:
  disable: false
  display_name: 'Authelia'
  enable_passkey_login: true
  timeout: "60 seconds"

# 认证用户源 (文件后端，支持热加载)
authentication_backend:
  file:
    path: /config/users_database.yml
    watch: true
    search:
      email: true
      case_insensitive: true

# 密码复杂度策略
password_policy:
  standard:
    enabled: true
    min_length: 8
    max_length: 0
    require_uppercase: true
    require_number: true
    require_special: true

# 访问控制策略 (ACL)
access_control:
  default_policy: deny
  rules:
    # 认证中心自身路由放行
    - domain:
        - 'auth.{{ env "DOMAIN" }}'
      policy: "bypass"

    # 开发环境特定路由
    - domain:
        - 'dev.{{ env "DOMAIN" }}'
      resources:
        - "^/docs(/.*)?$"
      policy: "one_factor"
      subject:
        - "group:user"
    - domain:
        - 'dev.{{ env "DOMAIN" }}'
      resources:
        - "^/horizon(/.*)?$"
        - "^/log-viewer(/.*)?$"
      policy: "one_factor"
      subject:
        - "group:admin"

    # API 文档与看板控制
    - domain:
        - 'rest.{{ env "DOMAIN" }}'
      resources:
        - "^/docs(/.*)?$"
      policy: "one_factor"
      subject:
        - "group:user"
    - domain:
        - 'rest.{{ env "DOMAIN" }}'
      resources:
        - "^/horizon(/.*)?$"
        - "^/log-viewer(/.*)?$"
      policy: "one_factor"
      subject:
        - "group:admin"

    # 默认顶级域与所有子域保护
    - domain:
        - '{{ env "DOMAIN" }}'
        - '*.{{ env "DOMAIN" }}'
      policy: "one_factor"
      subject:
        - "group:admin"

# 会话与 Cookie 配置 (对接 Redis/Valkey 缓存)
session:
  secret: '{{ env "SESSION_SECRET" }}'
  name: "authelia_session"
  inactivity: "60m"
  expiration: "3h"
  remember_me: "1M"
  cookies:
    - domain: '{{ env "DOMAIN" }}'
      authelia_url: 'https://auth.{{ env "DOMAIN" }}'
      default_redirection_url: 'https://{{ env "DOMAIN" }}'
      same_site: "lax"
  redis:
    host: '{{ env "REDIS_HOST" }}'
    port: 6379
    database_index: 0
    password: '{{ env "REDIS_PASSWORD" }}'

# 防暴力破解规则
regulation:
  max_retries: 3
  find_time: "2m"
  ban_time: "5m"

# 持久化存储 (SQLite)
storage:
  encryption_key: '{{ env "STORAGE_ENCRYPTION_KEY" }}'
  local:
    path: /data/db.sqlite3

# 邮件通知发信 (用于密码重置与 2FA 绑定)
notifier:
  disable_startup_check: true
  smtp:
    address: "submission://smtp.resend.com:587"
    username: '{{ env "RESEND_USER_NAME" }}'
    password: '{{ env "RESEND_API_KEY" }}'
    sender: "support@jso.lol"
    identifier: '{{ env "DOMAIN" }}'
    subject: "[Authelia] {title}"

# NTP 时间校准
ntp:
  address: "udp://time.cloudflare.com:123"
  version: 4
  max_desync: "3 seconds"
  disable_startup_check: false
  disable_failure: false

# Prometheus 监控指标
telemetry:
  metrics:
    enabled: true
    address: "tcp://0.0.0.0:9959"

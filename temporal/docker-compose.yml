services:
  temporal:
    image: temporalio/temporal:1.10.0
    container_name: temporal
    restart: unless-stopped
    command:
      - server
      - start-dev
      - --ip=0.0.0.0
      - --port=7233
      - --ui-port=8233
      - --db-filename=/etc/temporal/temporal.db
      - --namespace=default
      - --metrics-port=9090
    ports:
      # Temporal Frontend gRPC 端口 (供 SDK 客户端与 Worker 连接)
      - "7233:7233"
      # Temporal Web UI 监控看板端口
      - "8233:8233"
    environment:
      - TZ=${TIMEZONE}
      # 允许在反代/HTTP 开发环境下正常使用 Web UI Cookie
      - TEMPORAL_CSRF_COOKIE_INSECURE=true
      # 容器内 CLI 探针连接地址
      - TEMPORAL_CLI_ADDRESS=127.0.0.1:7233
    volumes:
      - ${DATA_PATH}temporal:/etc/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - frontend
      - backend

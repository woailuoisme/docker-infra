# ==============================================================================
# Portainer CE - 轻量级容器管理与可视化排障面板 (Docker Management Console)
# ==============================================================================
# 【运维规范】
# 1. 本服务仅作为容器运行状态的可视化巡检与紧急排障工具。
# 2. 禁止在 Web UI 中手动修改或发布容器参数，防止破坏 Git 声明式单一事实源。
# 3. 访问入口由 Traefik 反向代理 (docker.${SITE_ADDRESS}) 统一承载 HTTPS 终结。
# ==============================================================================

services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:${PORTAINER_VERSION:-2.45.2-alpine}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      # 跳过首次启动 setup_token 验证，直接打开 Web UI 设置初始管理员密码
      - PORTAINER_NO_SETUP_TOKEN=1
    ports:
      # 默认仅绑定本地回环 127.0.0.1，外部流量统一走 Traefik 域名接入
      - "${PORTAINER_BIND:-127.0.0.1}:${PORTAINER_PORT:-9000}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_PATH:-./data/}portainer:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9000/api/system/status"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    networks:
      - frontend
      - backend

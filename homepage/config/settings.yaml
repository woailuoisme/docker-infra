---
# Homepage 全局设置配置
# 文档: https://gethomepage.dev/configs/settings/

# 页面基本信息
title: "Docker 基础架构与服务导航"
description: "云原生容器服务与运维管理中枢"
favicon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/homepage.webp

# 主题和外观设置
theme: dark
color: zinc
language: zh-CN
cardBlur: sm

# 图标和头部样式
iconStyle: theme
headerStyle: boxedWidgets
hideVersion: true

# 链接行为
target: _blank

# Docker 统计信息
showStats: true
statusStyle: "dot"
hideErrors: true

# 相等高度卡片与列排版
useEqualHeights: true
maxGroupColumns: 4

# 布局配置 - 精确匹配 services.yaml 6 大服务分组
layout:
  网关与安全:
    style: row
    columns: 4
    useEqualHeights: true
    icon: mdi-shield-lock-outline

  统一观测与运维:
    style: row
    columns: 4
    useEqualHeights: true
    icon: mdi-chart-timeline-variant-shimmer

  存储与数据库:
    style: row
    columns: 4
    useEqualHeights: true
    icon: mdi-database-outline

  通信与工作流:
    style: row
    columns: 4
    useEqualHeights: true
    icon: mdi-message-processing-outline

  检索与处理:
    style: row
    columns: 4
    useEqualHeights: true
    icon: mdi-magnify-scan

  业务服务:
    style: row
    columns: 4
    useEqualHeights: true
    icon: mdi-application-brackets-outline
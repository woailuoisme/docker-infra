---
# Homepage 顶部信息与小组件配置
# 文档: https://gethomepage.dev/configs/widgets/

- greeting:
    text_size: 2xl
    text: "欢迎回来"

- search:
    provider: duckduckgo
    target: _blank
    focus: false
    showSearchSuggestions: true

- datetime:
    text_size: xl
    format:
      timeStyle: short
      dateStyle: long
      hourCycle: h24
    locale: zh-CN

- resources:
    cpu: true
    memory: true
    disk: /
    network: true
    uptime: true
    units: metric
    refresh: 15000 # 优化轮询频率：从 3 秒放宽至 15 秒，大幅减轻后台高频序列化开销
    diskUnits: bytes

- openmeteo:
    label: Dongguan
    latitude: 23.018
    longitude: 113.7487
    timezone: Asia/Shanghai
    units: metric
    cache: 30 # 天气数据缓存延长至 30 分钟，减少后台请求与内存对象分配
    format:
      maximumFractionDigits: 1
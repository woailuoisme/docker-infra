services:
  garage:
    image: dxflrs/garage:v2.5.0
    container_name: garage
    restart: unless-stopped
    command: /garage server
    security_opt:
      - no-new-privileges:true
    ports:
      # S3 API: 默认 3900，公网统一由反向代理网关 (Traefik) 终结 HTTPS 接入
      - "3900:3900"
      # 静态网站/匿名读取端点: 与 S3 API 分离（未签名请求在 3900 上会被拒）
      - "3902:3902"
      # RPC 端口: 集群内部通信使用
      - "3901:3901"
      # Admin API: 节点管理与监控指标
      - "3903:3903"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - ${DATA_PATH}garage:/var/lib/garage
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN}
      RUST_LOG: garage=info
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.2"
          memory: 128M
    networks:
      - backend
      - frontend

  garage-webui:
    image: khairul169/garage-webui:1.1.0
    container_name: garage-webui
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "3909:3909"
    tmpfs:
      # 挂载 tmpfs 内存盘防止大文件分片上传时报错 (ParseMultipartForm)，避免宿主机磁盘 I/O 磨损
      - /tmp
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
    environment:
      API_BASE_URL: "http://garage:3903"
      S3_ENDPOINT_URL: "http://garage:3900"
      S3_REGION: "garage"
      CONFIG_PATH: "/etc/garage.toml"
      API_ADMIN_KEY: "${GARAGE_ADMIN_TOKEN}"
    depends_on:
      garage:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - backend
      - frontend

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      # OTLP gRPC 统一摄取端口 (各微服务/Worker 默认)
      - "4317:4317"
      # OTLP HTTP 摄取端口 (前端网页、移动端及受限环境)
      - "4318:4318"
      # 内部健康探针端点
      - "13133:13133"
      # Prometheus 自身监控指标端口 (队列水位/批处理统计)
      - "8888:8888"
    environment:
      # OpenObserve 鉴权凭证 (在 .env 中统一维护)
      - O2_AUTH=${O2_AUTH}
    volumes:
      # 仓库自包含配置只读挂载 (防篡改且无需依赖外部全局绝对路径)
      - ./config.yml:/etc/otelcol-contrib/config.yaml:ro
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      openobserve:
        condition: service_healthy
    networks:
      - backend
      - frontend

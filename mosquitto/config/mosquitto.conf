# ==============================================================================
# Eclipse Mosquitto 2.x 生产级精简配置
# 官方参考: https://mosquitto.org/man/mosquitto-conf-5.html
# ==============================================================================

# ------------------------------------------------------------------------------
# 监听器配置 (Listeners)
# ------------------------------------------------------------------------------
# 1. TCP MQTT 协议内部监听器 (供容器内 Telegraf/微服务直连，开启 TCP_NODELAY 降延迟)
listener 1883 0.0.0.0
set_tcp_nodelay true

# 2. TCP MQTT 网关接入监听器 (专供 Traefik MQTTS 代理，开启 PROXY protocol v2 还原真实客户端 IP)
listener 1884 0.0.0.0
enable_proxy_protocol 2
set_tcp_nodelay true

# 3. WebSockets 协议监听器 (供 Web 前端、H5、IoT 仪表盘经 Traefik wss:// 反代访问)
listener 9001 0.0.0.0
protocol websockets

# ------------------------------------------------------------------------------
# 认证与安全策略 (Security & ACL)
# ------------------------------------------------------------------------------
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# ------------------------------------------------------------------------------
# 持久化与会话 (Persistence & Session)
# ------------------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/
autosave_interval 300
persistent_client_expiration 1d

# ------------------------------------------------------------------------------
# 资源限制与 DoS 防护 (Resource Limits & Protection)
# ------------------------------------------------------------------------------
max_packet_size 10485760
max_queued_messages 2000
max_inflight_messages 40

# ------------------------------------------------------------------------------
# 日志系统与监控 (Logging & Monitoring)
# ------------------------------------------------------------------------------
log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp_format %Y-%m-%d %H:%M:%S
sys_interval 60

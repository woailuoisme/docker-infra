services:
  openbao:
    image: openbao/openbao:2.7
    container_name: openbao
    restart: unless-stopped
    command:
      - server
    environment:
      - BAO_ADDR=http://127.0.0.1:8200
      - TZ=${TIMEZONE:-Asia/Shanghai}
    volumes:
      - ./config/openbao.hcl:/openbao/config/openbao.hcl:ro
      - ${DATA_PATH:-./data/}openbao/data:/openbao/file
      - ${LOG_PATH:-./logs/}openbao:/openbao/logs
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8200/v1/sys/health?uninitcode=200&sealedcode=200&standbycode=200"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      backend:
        aliases:
          - open-bao
      frontend:
        aliases:
          - open-bao


[tools]
# --- 统一任务运行器与版本控制门禁 ---
just = "latest"     # 统一运维任务与生命周期运行器
lefthook = "latest" # Git 提交流程质量门禁

# --- 代码质量与静态分析 (CI & Pre-commit) ---
shellcheck = "latest" # Shell 脚本静态分析
shfmt = "latest"      # Shell 脚本格式化
hadolint = "latest"   # Dockerfile 语法与规范检测
actionlint = "latest" # GitHub Actions 工作流语法分析
rumdl = "latest"      # Markdown 规范检测与格式化

# --- 容器与镜像工程化工具 ---
lazydocker = "latest" # 终端 Docker 交互式管理面板
dive = "latest"       # Docker 镜像分层与体积深度分析工具
trivy = "latest"      # 容器镜像、Dockerfile 与 Compose 安全漏洞/配置风险扫描器

# --- 结构化数据解析与自动化辅助 ---
jq = "latest" # JSON 命令行处理器 (docker inspect / API 响应解析)
yq = "latest" # YAML/TOML 命令行处理器 (Compose 编排文件处理)

gitleaks = "latest"

# ==============================================================================
# PostgreSQL 客户端认证配置 (Host-Based Authentication)
# ==============================================================================
# 作用：决定"哪个客户端从哪个地址、以哪个用户、连哪个库、用哪种认证方式"，
#       是数据库访问的第一道门禁，与 postgresql.conf 中的权限参数相互独立。
# 位置：由 postgresql.conf 的 hba_file 参数指向本文件 (/etc/postgresql/pg_hba.conf)，
#       故官方镜像运行时生成到 PGDATA 的那份不再生效。
# 维护：随仓库版本化管理，便于 review / diff / 回滚；改完执行
#       SELECT pg_reload_conf(); 即可生效（无需重启）。
# 规则：自上而下首条匹配即生效，越具体的规则必须写在前；database 列的 all
#       不匹配复制连接，故物理备份/PITR 需要单独的 replication 规则。
# 部署：compose 以只读方式挂载到 /etc/postgresql/pg_hba.conf。
# ==============================================================================

# --- 本地 socket：初始化脚本与容器内运维依赖免密 ---
local   all           all                                 trust
host    all           all         127.0.0.1/32            trust
host    all           all         ::1/128                 trust

# --- 业务连接：仅 backend 网段，统一走密码 ---
# shortcut: 网段由 docker 自动分配，重建 backend 网络或需宿主机直连时改此处
host    all           all         192.168.107.0/24        scram-sha-256

# --- Databasus 物理备份：复制连接不受 'all' 数据库规则覆盖 ---
host    replication   all         192.168.107.0/24        scram-sha-256

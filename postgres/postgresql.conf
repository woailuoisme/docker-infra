listen_addresses = '*'
max_connections = 50
max_worker_processes = 24

# 扩展预加载
shared_preload_libraries = 'timescaledb,pg_cron,pg_stat_statements'
cron.database_name = 'postgres'
cron.timezone = 'Asia/Shanghai'

# pg_stat_statements 慢查询与统计
pg_stat_statements.track = all
pg_stat_statements.max = 10000

# TimescaleDB
timescaledb.max_background_workers = 16
timescaledb.telemetry_level = off
timescaledb.license = 'apache'

# 内存规划 (基准: 1GB 宿主内存，防 OOM)
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 2MB
maintenance_work_mem = 128MB

# WAL 与检查点 (平滑 I/O 尖峰)
wal_buffers = 4MB
wal_compression = lz4
max_wal_size = 512MB
min_wal_size = 128MB
checkpoint_timeout = 10min

# 存储与 I/O 成本 (针对 SSD/云盘优化)
random_page_cost = 1.1
effective_io_concurrency = 150

# 分区查询加速 (配合 TimescaleDB 超表)
enable_partitionwise_join = on
enable_partitionwise_aggregate = on

# 自动清理 Autovacuum (防表膨胀与低内存保护)
autovacuum_max_workers = 2
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
autovacuum_work_mem = 32MB
log_autovacuum_min_duration = 2000

# 日志与慢查询 (耗时超 1s 记录，输出至 stderr 容器日志)
log_min_messages = error
log_min_duration_statement = 1000
log_line_prefix = '%t [%p]: '
log_timezone = 'Asia/Shanghai'

# 超时熔断保护 (防止长事务锁表与死锁堆积)
statement_timeout = 60000
lock_timeout = 30000
idle_in_transaction_session_timeout = 120000
timezone = 'Asia/Shanghai'
jit = off

# 脏页后台写入与 TCP 保活 (防止悬挂死连接)
bgwriter_delay = 50ms
bgwriter_lru_maxpages = 200
bgwriter_lru_multiplier = 3.0
tcp_keepalives_idle = 120
tcp_keepalives_interval = 30
tcp_keepalives_count = 3

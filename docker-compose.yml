# ==============================================================================
# 基础设施与云原生全栈服务编排 (Cloud-Native Infrastructure Stack)
# ==============================================================================

include:
  # --- 1. 网络与反向代理网关 (Edge Gateway & Ingress) ---
  - traefik/docker-compose.yml             # Traefik v3 边缘网关、HTTP/3、动态路由与 Let's Encrypt 证书签发
  # - caddy/docker-compose.yml
  - sablier/docker-compose.yml             # Sablier v1.19.1 容器动态实时监控与调度
  - error-pages/docker-compose.yml         # 统一现代化 HTTP 4xx/5xx 自定义美化错误页服务
  - dnsmasq/docker-compose.yml             # DNSMasq 本地 DNS 解析服务

  # --- 2. 安全合规与入侵防御 (Security & Compliance) ---
  - crowdsec/docker-compose.yml            # CrowdSec 行为分析、恶意 IP 自动化封禁与 AppSec WAF
  - authelia/docker-compose.yml            # Authelia 2FA / SSO 单点登录与 Web 前置鉴权代理
  - open-bao/docker-compose.yml            # OpenBao 安全凭据、KV v2 核心机密引擎与 AppRole 访问控制

  # --- 3. 核心持久化与数据库 (Databases & Storage) ---
  - postgres/docker-compose.yml            # PostgreSQL 18 + TimescaleDB + pgvector + PostGIS 核心多模数据库
  - pgbouncer/docker-compose.yml
  - valkey/docker-compose.yml              # Valkey 8.0 高性能内存键值缓存与分布式锁
  - garage/docker-compose.yml              # Garage 轻量级分布式 S3 对象存储与 WebUI 控制台
  # - postgres19/docker-compose.yml          # PostgreSQL 19 预览版多模数据库
  - qdrant/docker-compose.yml              # Qdrant 向量数据库与相似度检索
  # - surrealdb/docker-compose.yml           # SurrealDB 多模型数据库 (文档/图/时序)
  # - falkordb/docker-compose.yml            # FalkorDB 图数据库与 Redis 协议查询

  # --- 4. 实时通信、消息队列与工作流 (Messaging & Workflows) ---
  - centrifugo/docker-compose.yml          # Centrifugo v6 实时 WebSocket / SSE 广播引擎
  - mosquitto/docker-compose.yml           # Eclipse Mosquitto MQTT 物联网与设备消息 Broker
  # - rmqtt/docker-compose.yml               # RMQTT 高性能 MQTT Broker 集群 (Mosquitto 替代方案)
  # - nats/docker-compose.yml                # NATS 高性能轻量消息与 JetStream 流引擎
  # - temporal/docker-compose.yml            # Temporal 分布式微服务编排与持久工作流引擎
  # - restate/docker-compose.yml             # Restate 轻量事件驱动持久执行与微服务编排引擎
  - asynqmon/docker-compose.yml            # Asynq 分布式异步任务队列 Web 监控看板
  # - bull-board/docker-compose.yml          # Bull / BullMQ 异步队列 Web 监控看板

  # --- 5. 全文检索与动态媒体渲染 (Search & Media Processing) ---
  - meilisearch/docker-compose.yml         # Meilisearch 高性能轻量全文搜索引擎
  - imgproxy/docker-compose.yml            # imgproxy 快速安全动态图片缩放、格式协商与裁剪服务

  # --- 6. 统一可观测性与运维监控 (Observability & Ops) ---
  - otel-collector/docker-compose.yml      # OpenTelemetry Collector 统一遥测日志/指标/追踪收集与清洗
  - open-observe/docker-compose.yml        # OpenObserve 极简云原生日志分析与时序指标观测平台
  - dozzle/docker-compose.yml              # Dozzle 容器运行状态与流式日志实时查看面板
  - beszel/docker-compose.yml              # Beszel 轻量级现代化服务器与容器硬件指标看板
  - beszel-agent/docker-compose.yml        # Beszel Agent 宿主机指标采集探针
  - databasus/docker-compose.yml           # Databasus 数据库备份恢复 (postgres → garage S3)
  # - gatus/docker-compose.yml               # Gatus 自动化服务健康检查与状态页看板
  # - umami/docker-compose.yml               # Umami 现代化轻量网站分析与用户行为洞察平台
  # - grafana/docker-compose.yml             # Grafana 13.x 统一时序数据监控、Arrow Flight SQL 与 IoT 看板平台

  # --- 7. 统一导航与管理门户 (Portals & Navigation) ---
  - homepage/docker-compose.yml            # Homepage 统一运维与服务导航面板

  # --- 8. 业务应用与微服务 (Applications & Services) ---
  # - app/docker-compose.yml                 # bgin-api 核心业务服务与异步工作流
  # - convex/docker-compose.yml              # Convex 全栈后端与实时数据同步引擎
  # - pocketbase/docker-compose.yml          # PocketBase 单文件后端 (SQLite + 认证 + 实时订阅)

  # --- 9. 物联网、时序数据与设备模拟 (IoT & Time-Series Stack) ---
  - influxdb/docker-compose.yml            # InfluxDB 3 Apache Arrow 列式时序引擎与 Web 控制台
  - telegraf/docker-compose.yml            # Telegraf 统一 MQTT IoT 遥测消费与数据清洗通道
  - simulator/docker-compose.yml           # IoT 冷链智能售货机集群模拟器 (按需启动: profile iot)

  - mailpit/docker-compose.yml             # Mailpit 邮件服务器与 Web 管理界面
  # - trailbase/docker-compose.yml
  # - atuin/docker-compose.yml               # Atuin 终端命令历史加密同步服务端 (SQLite)
# ------------------------------------------------------------------------------
# 顶层集群共享网络定义 (Global Overlay / Bridge Networks)
# ------------------------------------------------------------------------------
networks:
  frontend:
    name: frontend
    driver: bridge
  backend:
    name: backend
    driver: bridge

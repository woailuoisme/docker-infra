name: Build and Push Docker Images

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Select service to build and push"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - postgres
          - postgres19
          - dnsmasq
          - caddy-base
          - simulator

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: Prepare Matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate build matrix
        id: set-matrix
        run: |
          SERVICES='[
            {"service": "postgres", "context": "./postgres", "file": "./postgres/Dockerfile", "image": "postgres", "tag": "18-trixie", "enable_latest": true},
            {"service": "postgres19", "context": "./postgres19", "file": "./postgres19/Dockerfile", "image": "postgres", "tag": "19-trixie", "enable_latest": false},
            {"service": "dnsmasq", "context": "./dnsmasq", "file": "./dnsmasq/Dockerfile", "image": "dnsmasq", "tag": "", "enable_latest": true},
            {"service": "caddy-base", "context": "./caddy-base", "file": "./caddy-base/Dockerfile", "image": "caddy-base", "tag": "", "enable_latest": true},
            {"service": "simulator", "context": "./simulator", "file": "./simulator/Dockerfile", "image": "simulator", "tag": "", "enable_latest": true}
          ]'
          MATRIX=$(echo "$SERVICES" | jq -c --arg s "${{ inputs.service }}" \
            'if $s == "all" or $s == "" then {include: .} else {include: [.[] | select(.service == $s)]} end')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build & Push (${{ matrix.service }})
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ matrix.tag }},enable=${{ matrix.tag != '' }}
            type=raw,value=latest,enable=${{ matrix.enable_latest && github.ref_name == github.event.repository.default_branch }}
            type=ref,event=branch,enable=${{ matrix.service != 'postgres19' }}
            type=semver,pattern={{version}},enable=${{ matrix.service != 'postgres19' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ matrix.service != 'postgres19' }}
            type=sha,prefix=${{ matrix.tag != '' && format('{0}-', matrix.tag) || '' }},format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

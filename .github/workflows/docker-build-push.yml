name: Build and Push Docker Images

on:
  workflow_dispatch:
    inputs:
      postgres:
        description: "Build & Push postgres (18-trixie)"
        type: boolean
        default: false
      postgres19:
        description: "Build & Push postgres19 (19-trixie)"
        type: boolean
        default: false
      caddy-base:
        description: "Build & Push caddy-base"
        type: boolean
        default: false
      simulator:
        description: "Build & Push simulator"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: Prepare Matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_targets: ${{ steps.set-matrix.outputs.has_targets }}
    steps:
      - name: Generate build matrix
        id: set-matrix
        run: |
          SELECTED=$(jq -n -c \
            --argjson pg "${{ inputs.postgres }}" \
            --argjson pg19 "${{ inputs.postgres19 }}" \
            --argjson caddy "${{ inputs.caddy-base }}" \
            --argjson sim "${{ inputs.simulator }}" \
            '[
              (if $pg then "postgres" else empty end),
              (if $pg19 then "postgres19" else empty end),
              (if $caddy then "caddy-base" else empty end),
              (if $sim then "simulator" else empty end)
            ]')
          SERVICES='[
            {"service": "postgres", "context": "./postgres", "file": "./postgres/Dockerfile", "image": "postgres", "tag": "18-trixie"},
            {"service": "postgres19", "context": "./postgres19", "file": "./postgres19/Dockerfile", "image": "postgres", "tag": "19-trixie"},
            {"service": "caddy-base", "context": "./caddy-base", "file": "./caddy-base/Dockerfile", "image": "caddy-base", "tag": ""},
            {"service": "simulator", "context": "./simulator", "file": "./simulator/Dockerfile", "image": "simulator", "tag": ""}
          ]'
          MATRIX=$(echo "$SERVICES" | jq -c --argjson sel "$SELECTED" \
            '{include: [.[] | select(.service as $s | $sel | index($s) != null)]}')
          HAS_TARGETS=$(echo "$MATRIX" | jq -r '(.include | length) > 0')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "has_targets=$HAS_TARGETS" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build & Push (${{ matrix.service }})
    needs: prepare
    if: needs.prepare.outputs.has_targets == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ matrix.tag }},enable=${{ matrix.tag != '' }}
            type=raw,value=latest,enable=${{ matrix.tag == '' && github.ref_name == github.event.repository.default_branch }}
            type=ref,event=branch,enable=${{ matrix.tag == '' }}
            type=semver,pattern={{version}},enable=${{ matrix.tag == '' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ matrix.tag == '' }}
            type=sha,prefix=,format=short,enable=${{ matrix.tag == '' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

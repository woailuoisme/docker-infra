services:
  nats:
    image: nats:2.15-alpine
    container_name: nats
    restart: unless-stopped
    command:
      - "--jetstream"
      - "--http_port=8222"
      - "--store_dir=/data"
    ports:
      # NATS 客户端核心协议通信端口
      - "4222:4222"
      # HTTP 监控与状态探针端口
      - "8222:8222"
    environment:
      - TZ=${TIMEZONE}
    volumes:
      - ${DATA_PATH}nats:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8222/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - backend
      - frontend

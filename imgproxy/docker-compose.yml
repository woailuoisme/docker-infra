services:
  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:${IMGPROXY_VERSION:-v4.0}
    container_name: imgproxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      # 默认绑定本地回环 127.0.0.1，统一经反向代理网关 (Traefik) 实现边缘缓存与加速
      - "${IMGPROXY_BIND:-127.0.0.1}:${IMGPROXY_PORT:-8088}:8080"
    environment:
      - IMGPROXY_KEY=${IMGPROXY_KEY}
      - IMGPROXY_SALT=${IMGPROXY_SALT}
      # 是否允许未签名 URL 访问 (开发调试设为 true，生产环境可在 .env 中重写为 false)
      - IMGPROXY_INSECURE_URLS=${IMGPROXY_INSECURE_URLS:-true}
      # 开发错误调试模式 (响应 Header 及日志中输出详细错误堆栈)
      - IMGPROXY_DEVELOPMENT_ERRORS_MODE=${IMGPROXY_DEVELOPMENT_ERRORS_MODE:-true}
      # 本地文件系统根目录 (配合 local:/// 协议直接读取挂载目录图片)
      - IMGPROXY_LOCAL_FILESYSTEM_ROOT=/mnt
      # 自适应图片格式协商
      - IMGPROXY_ENABLE_WEBP_DETECTION=${IMGPROXY_ENABLE_WEBP_DETECTION:-true}
      - IMGPROXY_ENABLE_AVIF_DETECTION=${IMGPROXY_ENABLE_AVIF_DETECTION:-true}
    volumes:
      # 业务上传文件与本地媒体只读挂载
      - ${DATA_PATH}:/mnt/data:ro
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.2"
          memory: 256M
    networks:
      - frontend
      - backend

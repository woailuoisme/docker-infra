services:
  pgbackups:
    image: prodrigestivill/postgres-backup-local:${PGBACKUPS_VERSION:-18-alpine}
    container_name: pgbackups
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # 持久化备份目录 (具备自包含安全兜底)
      - ${DATA_PATH:-./data/}pgbackups:/backups
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=${TIMEZONE:-Asia/Shanghai}
      # 整库全面转储：去除 --schema=public 限制以覆盖 TimescaleDB 等所有扩展 Schema，并启用 -Z6 高效压缩与大对象导出
      - POSTGRES_EXTRA_OPTS=-Z6 --blobs
      # 调度策略：每日凌晨 03:00 自动快照，容器启动时立即执行一次基线备份验真
      - SCHEDULE=0 3 * * *
      - BACKUP_ON_START=TRUE
      # 多层轮转归档策略：保留 7 天日备、4 周周备、6 个月月备
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      # 监控探针端口：超期未备份或备份失败返回 500
      - HEALTHCHECK_PORT=8080
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 64M
    networks:
      - backend

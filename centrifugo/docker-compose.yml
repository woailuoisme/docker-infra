services:
  centrifugo:
    image: centrifugo/centrifugo:v6.10
    container_name: centrifugo
    restart: unless-stopped
    command: ["centrifugo", "-c", "/centrifugo/config.yaml"]
    # 每条长连接占 1 个 fd，按连接规模上调
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    # 大于 shutdown.timeout(30s)，保证优雅下线不被 SIGKILL 打断
    stop_grace_period: 40s
    volumes:
      - ./config.yaml:/centrifugo/config.yaml:ro
    ports:
      - "${CENTRIFUGO_PORT:-48000}:8000"    # 客户端传输 + HTTP API
    environment:
      # ---------- 密钥（必填，无默认值，缺失即启动失败） ----------
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY}                  # HTTP API 鉴权，随机 UUID
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_HMAC_SECRET_KEY}   # 连接 JWT 签名，须与后端一致
      CENTRIFUGO_ADMIN_PASSWORD: ${CENTRIFUGO_ADMIN_PASSWORD}          # Admin UI 登录密码，强随机
      CENTRIFUGO_ADMIN_SECRET: ${CENTRIFUGO_ADMIN_SECRET}              # Admin API 鉴权，随机密钥
      # ---------- 拓扑（可被部署环境覆盖） ----------
      CENTRIFUGO_ENGINE_REDIS_ADDRESS: "${CENTRIFUGO_REDIS_ADDRESS:-redis://:${REDIS_PASSWORD}@valkey:6379/0}"
      CENTRIFUGO_CHANNEL_PROXY_SUBSCRIBE_ENDPOINT: "${CENTRIFUGO_PROXY_ENDPOINT:-http://app:3300/v1/realtime/proxy/subscribe}"
      CENTRIFUGO_CHANNEL_PROXY_SUBSCRIBE_TIMEOUT: "${CENTRIFUGO_PROXY_TIMEOUT:-2s}"
      # ---------- 安全（空格分隔的 Origin 白名单，生产禁止 *） ----------
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: "${CENTRIFUGO_ALLOWED_ORIGINS:-http://localhost:5173 http://127.0.0.1:5173}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - valkey
    networks:
      - default
networks:
  default:
    name: backend
    external: true

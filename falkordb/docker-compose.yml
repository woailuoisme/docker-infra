services:
  falkordb:
    image: falkordb/falkordb:6.2.0-redis
    container_name: falkordb
    restart: unless-stopped
    ports:
      - "7379:6379" # Redis 协议
      - "3001:3000" # FalkorDB Browser
    environment:
      - REDIS_ARGS=--requirepass ${FALKORDB_PASSWORD}
      - AUTH_SECRET=${FALKORDB_AUTH_SECRET}
      - ENCRYPTION_KEY=${FALKORDB_ENCRYPTION_KEY}
    volumes:
      - ${DATA_PATH}/falkordb_data:/var/lib/falkordb/data
      - ${DATA_PATH}/falkordb_browser:/app/.data
